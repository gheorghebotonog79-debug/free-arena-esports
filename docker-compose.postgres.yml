services:
  postgres:
    image: postgres:16-alpine
    container_name: free-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-free_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-free_arena}
      POSTGRES_USER: ${POSTGRES_USER:-free_arena}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - free_arena_postgres_data:/var/lib/postgresql/data

volumes:
  free_arena_postgres_data:
